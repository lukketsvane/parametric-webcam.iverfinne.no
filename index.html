<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<meta name="description" content="Parametric webcam mounts. Shape with gestures, adjust precise dimensions, export your model.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Webcam Studio">
<meta name="mobile-web-app-capable" content="yes">
<title>Webcam · Parametric Studio</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/assets/style.css">
<script type="module" src="/assets/app.js"></script>
</head>
<body>
<main class="studio">
  <header class="site-link"><a href="https://iverfinne.no" target="_blank" rel="noopener noreferrer">iverfinne.no</a></header>
  <section class="stage" aria-label="Interactive 3D model">
    <div id="viewport"><canvas id="canvas" aria-label="3D webcam mount. Drag to rotate, pinch to zoom, two-finger drag to shape."></canvas><svg id="dimension-overlay" class="dimension-overlay" role="img" aria-label="Mount dimensions in millimetres" hidden></svg><div class="loading" id="loading">building</div></div>
    <div class="stage-meta"><span class="material-label"><i aria-hidden="true"></i>matte black PLA</span><span id="projection-label" hidden>orthographic</span><output id="model-size" class="model-size" aria-label="Overall model dimensions">178.4 × 64.2 × 20.5 mm</output></div>
    <div class="build-state" id="build-state" role="status" aria-live="polite"></div>
  </section>
  <div class="dock-wrap">
    <section class="dock" aria-label="Webcam controls">
      <div class="dock-header">
        <select id="camera_count" data-param="camera_count" class="engine-picker" aria-label="Camera count"></select>
        <span class="piece-name"><output id="dock-spacing">140</output><span id="spacing-unit"> mm</span></span>
        <button id="export-stl" class="icon-button solid" aria-label="Download STL" title="Download STL" data-icon="download" disabled></button>
        <button id="controls-toggle" class="icon-button" aria-label="Show controls" aria-expanded="false" aria-controls="controls-body" data-icon="sliders"></button>
      </div>
      <div id="controls-body" class="controls-body" hidden>
        <div class="history-controls" aria-label="Edit history"><button class="chip" id="undo" disabled title="Undo (⌘/Ctrl Z)"><span data-icon="undo"></span>undo</button><button class="chip" id="redo" disabled title="Redo (⌘/Ctrl Shift Z)"><span data-icon="redo"></span>redo</button></div>
        <div class="primary-fields" id="layout-fields"></div>
        <div class="view-controls" aria-label="View controls"><button class="chip selected" data-view="iso" aria-pressed="true">3D</button><button class="chip" data-view="front" title="Front · orthographic" aria-pressed="false">front</button><button class="chip" data-view="rear" title="Rear · orthographic" aria-pressed="false">rear</button><button class="chip" data-view="top" title="Top · orthographic" aria-pressed="false">top</button><button class="chip" id="fit-view" aria-label="Fit model to view" data-icon="fit"></button><button class="chip" id="dimensions-toggle" aria-label="Show dimensions" aria-pressed="false" data-icon="ruler"></button><button class="chip" id="wire-toggle" aria-label="Show wireframe" aria-pressed="false" data-icon="wire"></button></div>
        <details><summary>camera<span data-icon="chevron"></span></summary><div id="camera-fields"></div><div id="lens-fields"></div></details>
        <details><summary>mount<span data-icon="chevron"></span></summary><div id="fit-fields"></div><p class="field-note">Clearance is total, split across both sides.</p><div id="adapter-fields"></div></details>
        <details><summary>cable &amp; retention<span data-icon="chevron"></span></summary><div id="cable-fields"></div></details>
        <div class="export-row" aria-label="Export formats"><button class="chip" id="export-scad">OpenSCAD</button><button class="chip" id="export-json">settings</button><label class="chip import-settings">import<input id="import-json" type="file" accept=".json,application/json" aria-label="Import saved settings"></label><button class="chip" id="share">share</button><button class="chip" id="reset">reset</button></div>
        <p class="gesture-note">drag to orbit · pinch to zoom<br>two fingers to shape · three to light</p>
      </div>
    </section>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</main>
</body>
</html>
