<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parametric Webcam</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#171717;font:14px system-ui}header{height:64px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 24px}main{display:grid;grid-template-columns:1fr 310px;min-height:calc(100dvh - 64px)}.stage{position:relative;overflow:hidden;display:grid;place-items:center;background:#ededeb}canvas{width:100%;height:100%;touch-action:none}.panel{background:#fff;padding:28px;border-left:1px solid #ddd}.label{font-size:11px;letter-spacing:.1em;color:#777;text-transform:uppercase;margin:24px 0 12px}.counter{display:flex;align-items:center;justify-content:space-between}.counter button{width:44px;height:44px;border:1px solid #ddd;background:white;font-size:24px;border-radius:10px}.counter strong{font-size:42px;font-weight:400}input[type=range]{width:100%;accent-color:#222}input[type=number]{width:90px;padding:10px;border:1px solid #ddd;border-radius:8px;font:inherit}.field{display:flex;align-items:center;justify-content:space-between;gap:12px}button{cursor:pointer}button.primary{background:#161616;color:white;border:0;border-radius:10px;padding:14px 16px;width:100%;margin-top:12px}button.secondary{background:white;color:#111;border:1px solid #ccc;border-radius:10px;padding:13px;width:100%;margin-top:10px}.meta{position:absolute;bottom:22px;left:24px;color:#777;font-size:12px}.top{position:absolute;top:20px;left:24px;color:#777;font-size:12px}@media(max-width:750px){main{display:flex;flex-direction:column}.stage{height:52dvh;min-height:300px}.panel{border:0;border-top:1px solid #ddd;padding:22px}header{padding:0 18px}}</style><header><b>PARAMETRIC / WEBCAM</b><span>01 — 14</span></header><main><section class="stage"><div class="top">DRAG TO ROTATE · PINCH TO ZOOM</div><canvas id="view"></canvas><div class="meta" id="dimensions"></div></section><aside class="panel"><div class="label">Cameras</div><div class="counter"><button id="minus" aria-label="Fewer cameras">−</button><strong id="countText">2</strong><button id="plus" aria-label="More cameras">+</button></div><input id="count" type="range" min="1" max="14" step="1" value="2"><div class="label">Center spacing</div><div class="field"><span>Distance</span><label><input id="spacing" type="number" min="25" max="500" value="140"> mm</label></div><div class="label">Geometry</div><div class="field"><span>Cutout diameter</span><label><input id="diameter" type="number" min="5" max="80" value="19"> mm</label></div><div class="label">Mount</div><div class="field"><span>Wall thickness</span><label><input id="wall" type="number" min="2" max="30" value="12"> mm</label></div><div class="field" style="margin-top:14px"><span>Depth</span><label><input id="depth" type="number" min="3" max="40" value="20.5"> mm</label></div><div class="label">Export</div><button class="primary" id="stl">Download STL</button><button class="secondary" id="share">Copy configuration link</button><p style="color:#888;font-size:12px;line-height:1.6;margin-top:24px">Dimensions in millimeters. Centered mounting boss included. Verify physical fit before printing.</p></aside></main><script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
import {OrbitControls} from 'https://esm.sh/three@0.180.0/addons/controls/OrbitControls.js';
import {STLExporter} from 'https://esm.sh/three@0.180.0/addons/exporters/STLExporter.js';
const ids=['count','spacing','diameter','wall','depth'];const el=Object.fromEntries(ids.map(x=>[x,document.getElementById(x)]));const params=new URLSearchParams(location.hash.slice(1));ids.forEach(k=>{if(params.has(k))el[k].value=params.get(k)});
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(38,1,.1,10000);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(1,3,5);scene.add(light,new THREE.AmbientLight(0xffffff,1.4));let mount;
function values(){return {n:Math.max(1,Math.min(14,+el.count.value||1)),s:Math.max(25,+el.spacing.value||140),d:Math.max(5,+el.diameter.value||19),w:Math.max(2,+el.wall.value||12),t:Math.max(3,+el.depth.value||20.5)}}
function mesh(v){const outer=v.d+2*v.w,r=v.d/2,rr=outer/2;const length=(v.n-1)*v.s+outer;const height=outer;const shape=new THREE.Shape();const x=-length/2,y=-height/2;const radius=Math.min(9,height/4);shape.moveTo(x+radius,y);shape.lineTo(x+length-radius,y);shape.quadraticCurveTo(x+length,y,x+length,y+radius);shape.lineTo(x+length,y+height-radius);shape.quadraticCurveTo(x+length,y+height,x+length-radius,y+height);shape.lineTo(x+radius,y+height);shape.quadraticCurveTo(x,y+height,x,y+height-radius);shape.lineTo(x,y+radius);shape.quadraticCurveTo(x,y,x+radius,y);for(let i=0;i<v.n;i++){const hole=new THREE.Path();hole.absarc((i-(v.n-1)/2)*v.s,0,r,0,Math.PI*2,true);shape.holes.push(hole)}const geo=new THREE.ExtrudeGeometry(shape,{depth:v.t,bevelEnabled:true,bevelThickness:.6,bevelSize:.6,bevelSegments:2,curveSegments:48});geo.computeVertexNormals();const group=new THREE.Group();group.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x989b9b,metalness:.25,roughness:.43,side:THREE.DoubleSide})));const boss=new THREE.Mesh(new THREE.CylinderGeometry(12,12,8,48),new THREE.MeshStandardMaterial({color:0x777b7c,metalness:.35,roughness:.5}));boss.rotation.x=Math.PI/2;boss.position.set(0,0,v.t+4);group.add(boss);return group}
function update(){const v=values();el.count.value=v.n;document.getElementById('countText').textContent=v.n;if(mount){scene.remove(mount);mount.traverse(o=>{o.geometry?.dispose();o.material?.dispose()})}mount=mesh(v);scene.add(mount);const width=(v.n-1)*v.s+v.d+2*v.w;document.getElementById('dimensions').textContent=width.toFixed(1)+' × '+(v.d+2*v.w).toFixed(1)+' × '+(v.t+8).toFixed(1)+' mm';camera.position.set(width*.28,-width*.24,Math.max(115,width*1.35));controls.target.set(0,0,v.t/2);controls.update();location.replace('#'+new URLSearchParams(Object.fromEntries(ids.map(k=>[k,el[k].value]))))}
ids.forEach(k=>el[k].addEventListener('input',update));document.getElementById('minus').onclick=()=>{el.count.value=Math.max(1,+el.count.value-1);update()};document.getElementById('plus').onclick=()=>{el.count.value=Math.min(14,+el.count.value+1);update()};document.getElementById('share').onclick=()=>navigator.clipboard.writeText(location.href);
document.getElementById('stl').onclick=()=>{const clone=mount.clone();clone.updateMatrixWorld(true);const stl=new STLExporter().parse(clone,{binary:true});const blob=new Blob([stl],{type:'model/stl'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='webcam-mount-'+values().n+'x.stl';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function animate(){requestAnimationFrame(animate);const r=canvas.getBoundingClientRect();if(canvas.width!==Math.round(r.width*renderer.getPixelRatio())||canvas.height!==Math.round(r.height*renderer.getPixelRatio())){renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}controls.update();renderer.render(scene,camera)}update();animate();
</script></html>
